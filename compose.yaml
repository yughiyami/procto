services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: izumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: izumi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - izumi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izumi"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  izumi_pg:
